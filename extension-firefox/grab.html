<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BladeMail — links on this page</title>
<style>
  :root { --bg: #0f1522; --panel: #151c2b; --panel2: #1b2436; --line: #26314a; --text: #e6ebf5; --muted: #8a96ad; --acc: #2a9bf5; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f6fa; --panel: #fff; --panel2: #eef2f8; --line: #d9e0ec; --text: #17202f; --muted: #5e6b82; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 20px; z-index: 2; }
  h1 { font-size: 17px; margin: 0 0 2px; display: flex; align-items: center; gap: 9px; }
  h1 i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #3ad1b0, #2a9bf5); display: inline-block; }
  .src { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .chip { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .chip small { opacity: .75; margin-left: 4px; }
  input[type=search] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; min-width: 240px; flex: 1; max-width: 420px; }
  .acts { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .acts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .go { margin-left: auto; font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; color: #06121a; background: linear-gradient(135deg, #3ad1b0, #2a9bf5); }
  .go:disabled { opacity: .45; cursor: default; }
  #msg { color: var(--muted); }
  #msg.err { color: #f2617a; }
  main { padding: 6px 20px 30px; }
  .row { display: grid; grid-template-columns: 22px 54px 1fr; gap: 10px; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--panel2); }
  .row .t { min-width: 0; }
  .row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .u { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 10.5px; font-weight: 700; text-align: center; border-radius: 5px; padding: 3px 0; color: #0b1220; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><i></i>Download links from this page</h1>
  <div class="src" id="src">Reading the page…</div>
  <div class="bar" id="chips"></div>
  <div class="acts">
    <input type="search" id="q" placeholder="Filter by name or address (e.g. 1080, .zip, chapter)">
    <label><input type="checkbox" id="all"> Select all shown</label>
    <span id="msg"></span>
    <button class="go" id="go" disabled>Download selected</button>
  </div>
</header>
<main id="list"></main>
<script src="grab.js"></script>
</body>
</html>
