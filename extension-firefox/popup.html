<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 340px; background: #0f1420; color: #e6ebf5; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid #26314a; }
  header img { width: 22px; height: 22px; }
  header b { font-size: 15px; flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f2617a; display: inline-block; margin-right: 6px; }
  .dot.on { background: #3ad1b0; }
  .status { font-size: 12px; color: #8a96ad; }
  section { padding: 10px 14px; border-bottom: 1px solid #1a2233; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; cursor: pointer; }
  input[type=checkbox] { accent-color: #3ad1b0; width: 16px; height: 16px; }
  h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #8a96ad; font-weight: 600; }
  .m { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #1a2233; }
  .m:first-of-type { border-top: 0; }
  .m .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .m .k { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; background: #26314a; color: #cfd8ea; }
  button { font: inherit; font-size: 12px; color: #06121a; background: linear-gradient(135deg, #3ad1b0, #2a9bf5); border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: #8a96ad; font-size: 12px; }
  .help { color: #8a96ad; font-size: 11.5px; padding: 10px 14px; }
</style>
</head>
<body>
<header><img src="icons/icon32.png" alt=""><b>BladeMail</b><span class="status"><span id="dot" class="dot"></span><span id="st">Checking…</span></span></header>
<section>
  <label>Take over Chrome downloads <input type="checkbox" id="catch"></label>
  <label>Show “Download video” button on videos <input type="checkbox" id="vbtn"></label>
</section>
<section>
  <h4>Media found on this page</h4>
  <div id="media"><div class="muted">Nothing yet. Play a video to detect it.</div></div>
</section>
<div class="help" id="help"></div>
<script src="popup.js"></script>
</body>
</html>
