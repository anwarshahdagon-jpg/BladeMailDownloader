<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>BladeMail speed</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; font: 12px/1.3 "Segoe UI", system-ui, sans-serif; }
  body { background: #151c2b; color: #e6ebf5; border: 1px solid #26314a; box-sizing: border-box; padding: 9px 12px; -webkit-app-region: drag; cursor: move; }
  html.light body { background: #fff; color: #17202f; border-color: #d9e0ec; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .sp { font-size: 19px; font-weight: 700; }
  .mb { color: #3ad1b0; font-weight: 600; }
  html.light .mb { color: #0e8f73; }
  .x { margin-left: auto; -webkit-app-region: no-drag; cursor: pointer; opacity: .6; border: 0; background: none; color: inherit; font-size: 13px; }
  .x:hover { opacity: 1; }
  .info { opacity: .7; margin: 2px 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; border-radius: 3px; background: rgba(128, 140, 170, .25); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2a9bf5, #3ad1b0); transition: width .4s; }
</style>
</head>
<body title="Double-click to open BladeMail · drag to move">
  <div class="top"><span class="sp" id="sp">0 KB/s</span><span class="mb" id="mb">0 Mb/s</span><button class="x" id="open" title="Open BladeMail">⤢</button></div>
  <div class="info" id="info">Idle</div>
  <div class="bar"><i id="bar"></i></div>
<script>
  const fmt = (b) => { const u = ['B/s', 'KB/s', 'MB/s', 'GB/s']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (i ? b.toFixed(b < 10 ? 2 : 1) : Math.round(b)) + ' ' + u[i]; };
  const mbps = (b) => { const m = b * 8 / 1e6; return (m >= 1000 ? (m / 1000).toFixed(2) + ' Gb/s' : (m < 10 ? m.toFixed(2) : m.toFixed(1)) + ' Mb/s'); };
  window.fluxget.onTick(({ totalSpeed, active, overall }) => {
    document.getElementById('sp').textContent = fmt(totalSpeed || 0);
    document.getElementById('mb').textContent = mbps(totalSpeed || 0);
    document.getElementById('info').textContent = active ? `${active} downloading${overall != null ? ' · ' + (overall * 100).toFixed(1) + '%' : ''}` : 'Idle';
    document.getElementById('bar').style.width = overall != null ? (overall * 100).toFixed(1) + '%' : '0';
  });
  document.body.addEventListener('dblclick', () => window.fluxget.showMain());
  document.getElementById('open').addEventListener('click', () => window.fluxget.showMain());
</script>
</body>
</html>
