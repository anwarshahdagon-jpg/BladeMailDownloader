<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Download complete</title>
<style>
  html, body { margin: 0; height: 100%; background: #151c2b; color: #e6ebf5; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  body { border: 1px solid #26314a; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px 16px; -webkit-app-region: drag; }
  .top { display: flex; align-items: center; gap: 10px; }
  .ok { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #3ad1b0, #2a9bf5); display: grid; place-items: center; color: #06121a; font-weight: 800; flex: none; }
  .t { min-width: 0; flex: 1; }
  .h { font-weight: 700; }
  .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8a96ad; }
  .x { -webkit-app-region: no-drag; background: none; border: 0; color: #8a96ad; font-size: 15px; cursor: pointer; padding: 2px 6px; }
  .btns { display: flex; gap: 8px; margin-top: auto; justify-content: flex-end; -webkit-app-region: no-drag; }
  button.b { font: inherit; color: #e6ebf5; background: #1b2436; border: 1px solid #26314a; border-radius: 7px; padding: 6px 14px; cursor: pointer; }
  button.b:hover { background: #212c42; }
  html.light, html.light body { background: #fff; color: #17202f; }
  html.light body { border-color: #d9e0ec; }
  html.light button.b { background: #eef2f8; color: #17202f; border-color: #d9e0ec; }
  html.light .n, html.light .x { color: #5e6b82; }
  button.p { background: linear-gradient(135deg, #3ad1b0, #2a9bf5); border: 0; color: #06121a; font-weight: 600; }
</style>
</head>
<body>
  <div class="top">
    <div class="ok">✓</div>
    <div class="t"><div class="h">Download complete</div><div class="n" id="n"></div></div>
    <button class="x" id="x" title="Close">✕</button>
  </div>
  <div class="btns">
    <button class="b" id="folder">Open folder</button>
    <button class="b p" id="open">Open</button>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const id = q.get('id');
  const size = Number(q.get('size')) || 0;
  const fmt = (b) => { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + ' ' + u[i]; };
  document.getElementById('n').textContent = q.get('name') + (size ? ' · ' + fmt(size) : '');
  document.getElementById('n').title = q.get('name');
  const close = () => window.fluxget.closePopup();
  document.getElementById('x').onclick = close;
  document.getElementById('open').onclick = () => { window.fluxget.open(id); close(); };
  document.getElementById('folder').onclick = () => { window.fluxget.folder(id); close(); };
  let timer = setTimeout(close, 15000);
  document.body.addEventListener('mouseenter', () => clearTimeout(timer));
  document.body.addEventListener('mouseleave', () => { timer = setTimeout(close, 6000); });
  if (q.get('sound') === '1') {
    // short two-note chime, generated (no sound file needed)
    try {
      const ac = new AudioContext();
      [[880, 0], [1318.5, 0.13]].forEach(([f, t]) => {
        const o = ac.createOscillator(); const g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.45);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.5);
      });
    } catch (e) { /* no audio device */ }
  }
</script>
</body>
</html>
